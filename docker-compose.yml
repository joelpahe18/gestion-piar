services:
  mysql:
    image: mysql:8.0
    container_name: gestion-piar-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: gestion_piar
      MYSQL_USER: piar
      MYSQL_PASSWORD: piar_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gestion-piar-backend
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: piar
      DB_PASSWORD: piar_secret
      DB_NAME: gestion_piar
      JWT_SECRET: change_this_to_a_random_secret_in_production
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: .
    container_name: gestion-piar
    ports:
      - "9001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
